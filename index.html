    <script>
      // Suppress Vite development HMR WebSocket disconnection errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = (reason && (reason.message || reason.toString())) || '';
        if (
          message.indexOf('WebSocket closed without opened') !== -1 ||
          message.indexOf('[vite] failed to connect to websocket') !== -1 ||
          message.indexOf('WebSocket') !== -1
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var message = event.message || '';
        if (
          message.indexOf('WebSocket closed without opened') !== -1 ||
          message.indexOf('[vite] failed to connect to websocket') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
