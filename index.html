    <script>
      // Suppress Vite development HMR WebSocket disconnection errors in AI Studio iframe environment
      (function() {
        var isWsError = function(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('[vite] failed to connect to websocket') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('WebSocket') !== -1
          );
        };

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = (reason && (reason.message || reason.stack || reason.toString())) || '';
          if (isWsError(message)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function (event) {
          var message = (event && (event.message || event.error && event.error.message)) || '';
          if (isWsError(message)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (isWsError(joined)) return;
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (isWsError(joined)) return;
          origWarn.apply(console, arguments);
        };
      })();
    </script>
  </head>

  </body>
