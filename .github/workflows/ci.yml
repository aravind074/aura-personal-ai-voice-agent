name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Linting
        run: npm run lint

      - name: Production Frontend Build
        run: npm run build

      - name: Start Server in Background
        run: |
          npm start &
          sleep 4

      - name: Run Complete Automated Test Suite
        run: npm test

      - name: Verify Health Probes
        run: |
          curl -f http://localhost:3000/health || exit 1
          curl -f http://localhost:3000/ready || exit 1
